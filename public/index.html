<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sub-standard Sub-sailors: let etter de andre ubåtene med passiv sonar, og senk dem før de finner deg.">
  <meta name="theme-color" content="#07121f">
  <meta name="color-scheme" content="dark">
  <title>Sub-standard Sub-sailors</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/fonts/vt323/latin-400.css">
  <link rel="stylesheet" href="/vendor/fonts/pixelify-sans/latin-700.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/hud.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <main id="menu" class="screen">
    <div class="menu-card">
      <h1>Sub-standard<br>Sub-sailors</h1>
      <p class="tagline">S.S.S.S. Lytt. Gjett. Senk. Synk helst ikke selv.</p>
      <label for="name">Kapteinens navn</label>
      <input id="name" type="text" maxlength="16" autocomplete="nickname" placeholder="Kaptein ...">
      <button id="solo" class="btn primary">Spill alene mot bots</button>
      <button id="create" class="btn">Opprett spill for flere</button>
      <form id="join-form" class="join-row">
        <label for="code" class="visually-hidden">Romkode</label>
        <input id="code" type="text" maxlength="4" placeholder="KODE" autocapitalize="characters" autocomplete="off">
        <button class="btn" type="submit">Bli med</button>
      </form>
      <p id="menu-error" class="error" role="alert"></p>
      <button id="menu-help" class="link">Hvordan spiller man?</button>
    </div>
  </main>

  <main id="lobby" class="screen" hidden>
    <div class="menu-card">
      <h2>Rom <span id="room-code" class="code"></span></h2>
      <p class="hint">Del koden eller <button id="copy-link" class="link">kopier lenken</button> til de andre.</p>
      <ul id="lobby-players" class="player-list"></ul>
      <div id="host-controls">
        <button id="add-bot" class="btn">Legg til bot</button>
        <label for="timer">Tid per runde</label>
        <select id="timer">
          <option value="0">Ingen klokke</option>
          <option value="30">30 sekunder</option>
          <option value="60">60 sekunder</option>
          <option value="90">90 sekunder</option>
        </select>
        <button id="start" class="btn primary">Start spillet</button>
      </div>
      <p id="lobby-wait" class="hint" hidden>Venter på at verten starter spillet ...</p>
      <p id="lobby-error" class="error" role="alert"></p>
      <button id="leave-lobby" class="link">Forlat rommet</button>
    </div>
  </main>

  <main id="game" class="screen" hidden>
    <canvas id="stage" aria-label="Spillbrettet"></canvas>
    <div id="labels" aria-hidden="true"></div>

    <header class="hud top-left panel">
      <div class="round-line"><span id="round">Runde 1</span><span id="clock"></span></div>
      <div id="hull" class="hull ok">Skrog: helt</div>
      <div class="tools">
        <button id="rot-left" class="icon-btn" aria-label="Snu brettet mot venstre" title="Snu brettet (Q)">&#8634;</button>
        <button id="rot-right" class="icon-btn" aria-label="Snu brettet mot høyre" title="Snu brettet (E)">&#8635;</button>
        <button id="zoom-in" class="icon-btn zoom-btn" aria-label="Zoom inn" title="Zoom inn (+)">+</button>
        <button id="zoom-out" class="icon-btn zoom-btn" aria-label="Zoom ut" title="Zoom ut (-)">&minus;</button>
        <button id="sound" class="icon-btn" aria-label="Lyd av eller på" title="Lyd">&#9835;</button>
        <button id="help" class="icon-btn" aria-label="Regler" title="Regler">?</button>
        <button id="quit" class="icon-btn" aria-label="Forlat spillet" title="Forlat spillet">&#10005;</button>
      </div>
    </header>

    <aside class="hud top-right panel">
      <ul id="players" class="player-list compact"></ul>
    </aside>

    <section id="log-panel" class="hud log panel" aria-label="Loggbok">
      <button id="log-toggle" class="log-toggle" aria-expanded="true" aria-controls="log">
        <span>Loggbok</span><span id="log-arrow" aria-hidden="true">&#9662;</span>
      </button>
      <ol id="log" aria-live="polite"></ol>
    </section>

    <section id="orders" class="hud orders panel" aria-label="Ordre">
      <div class="helm">
        <div class="dpad" role="group" aria-label="Endre fart">
          <button data-slot="NW" class="pad"></button>
          <button data-slot="N" class="pad"></button>
          <button data-slot="NE" class="pad"></button>
          <button data-slot="W" class="pad"></button>
          <button data-slot="hold" class="pad hold" aria-label="Hold fart og kurs">&#9679;</button>
          <button data-slot="E" class="pad"></button>
          <button data-slot="SW" class="pad"></button>
          <button data-slot="S" class="pad"></button>
          <button data-slot="SE" class="pad"></button>
        </div>
        <div class="readout">
          <div id="speed">Fart: stille</div>
          <div id="noise">Støy: 10</div>
        </div>
      </div>
      <div class="actions" role="group" aria-label="Handling">
        <button data-action="listen" class="act">Lytt</button>
        <button data-action="focus" class="act">Fokuser sonar</button>
        <button data-action="fire" class="act">Torpedo</button>
        <button data-action="repair" class="act">Reparer</button>
      </div>
      <p id="hint" class="hint"></p>
      <button id="send" class="btn primary">Send ordre</button>
    </section>

    <div id="banner" class="banner" hidden>
      <h2 id="banner-title"></h2>
      <p id="banner-text"></p>
      <div class="banner-buttons">
        <button id="again" class="btn primary">Tilbake til lobbyen</button>
        <button id="watch" class="btn">Se på brettet</button>
      </div>
    </div>
  </main>

  <dialog id="rules">
    <h2>Slik spiller du</h2>
    <div id="rules-body"></div>
    <form method="dialog"><button class="btn primary">Lukk</button></form>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
